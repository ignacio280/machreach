<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MachReach — Estudiar deja de ser una lata</title>
<meta name="description" content="MachReach es la plataforma de estudio todo-en-uno para estudiantes: sesiones de enfoque, cursos detectados por extensión, flashcards, quizzes, seguimiento de notas y rankings. Estudia más inteligente."/>
<meta name="theme-color" content="#FFF6E9"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="v6/theme.css"/>
<link rel="stylesheet" href="v6/ui.css"/>
<style id="__om-edit-overrides"></style>
</head>
<body data-intro="pending">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="v5/tweaks-panel.jsx"></script>
<script type="text/babel" src="v5/motion.jsx"></script>
<script type="text/babel" src="v5/logo.jsx"></script>
<script type="text/babel" src="v6/icons.jsx"></script>
<script type="text/babel" src="v6/fx.jsx"></script>
<script type="text/babel" src="v6/intro.jsx"></script>
<script type="text/babel" src="v6/plan.jsx"></script>
<script type="text/babel" src="v6/analytics.jsx"></script>
<script type="text/babel" src="v6/hero.jsx"></script>
<script type="text/babel" src="v6/features.jsx"></script>
<script type="text/babel" src="v6/sections.jsx"></script>
<script type="text/babel" src="v6/sections2.jsx"></script>
<script type="text/babel" src="v6/pricing.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "coral",
  "playIntro": true,
  "doodles": false
}/*EDITMODE-END*/;

const NAV = [
  { href: "#features", label: "Features", id: "features" },
  { href: "#how", label: "Cómo funciona", id: "how" },
  { href: "#pricing", label: "Precios", id: "pricing" },
  { href: "#faq", label: "FAQ", id: "faq" },
];

function Nav({ tweaks, setTweak }) {
  const [stuck, setStuck] = React.useState(false);
  const [active, setActive] = React.useState(null);
  const wrap = React.useRef(null);
  const [pill, setPill] = React.useState({ left: 0, width: 0, on: false });

  React.useEffect(() => {
    const onScroll = () => {
      setStuck(scrollY > 12);
      let cur = null;
      NAV.forEach((n) => {
        const el = document.getElementById(n.id);
        if (el && el.getBoundingClientRect().top < innerHeight * 0.42) cur = n.id;
      });
      setActive(cur);
    };
    onScroll();
    addEventListener("scroll", onScroll, { passive: true });
    return () => removeEventListener("scroll", onScroll);
  }, []);

  React.useEffect(() => {
    const el = wrap.current; if (!el) return;
    const a = active && el.querySelector(`[data-id="${active}"]`);
    if (a) setPill({ left: a.offsetLeft, width: a.offsetWidth, on: true });
    else setPill((p) => ({ ...p, on: false }));
  }, [active]);

  return (
    <nav className={"nav" + (stuck ? " stuck" : "")}>
      <div className="container">
        <div className="nav-inner">
          <a href="#" className="logo"><span className="logo-mark"><Mark size={32} uid="nav" live /></span><Wordmark /></a>
          <div className="nav-links" ref={wrap}>
            <span className="nav-pill" style={{ left: pill.left, width: pill.width, opacity: pill.on ? 1 : 0 }} />
            {NAV.map((n) => <a key={n.id} href={n.href} data-id={n.id} className={active === n.id ? "on" : ""}>{n.label}</a>)}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button className="icon-btn" aria-label="Cambiar tema" onClick={() => setTweak("theme", tweaks.theme === "dark" ? "light" : "dark")}>
              {tweaks.theme === "dark" ? <IconSun size={18} /> : <IconMoon size={18} />}
            </button>
            <a href="https://machreach.com/register" className="btn btn-primary btn-sm nav-cta"><IconCanvas size={15} /><span className="nav-cta-full">Usar la extensión</span><span className="nav-cta-short">Empezar</span></a>
          </div>
        </div>
      </div>
    </nav>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [introKey, setIntroKey] = React.useState(1);

  React.useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme || "light";
    document.documentElement.dataset.accent = tweaks.accent || "coral";
    document.querySelectorAll(".doodles").forEach((d) => { d.style.display = tweaks.doodles ? "" : "none"; });
  }, [tweaks.theme, tweaks.accent, tweaks.doodles]);

  const replay = () => {
    scrollTo({ top: 0, behavior: "auto" });
    try { localStorage.removeItem("machreach:intro-complete"); } catch (_) {}
    document.body.dataset.intro = "pending";
    setIntroKey((k) => k + 1);
  };

  return (
    <>
      <IntroV6 key={introKey} enabled={!!tweaks.playIntro} onDone={() => { document.body.dataset.intro = "done"; }} />
      <ScrollProgressBar />
      <Nav tweaks={tweaks} setTweak={setTweak} />
      <Hero />
      <StatsStrip />
      <HowItWorks />
      <PlanSection />
      <LeaderboardShowcase />
      <AnalyticsSection />
      <QuizDemo />
      <Pricing />
      <FAQ />
      <FinalCTA />
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Tema">
          <TweakRadio label="Modo" value={tweaks.theme} onChange={(v) => setTweak("theme", v)}
            options={[{ value: "light", label: "Claro" }, { value: "dark", label: "Oscuro" }]} />
          <TweakSelect label="Acento" value={tweaks.accent} onChange={(v) => setTweak("accent", v)}
            options={[{ value: "coral", label: "Coral (marca)" }, { value: "lime", label: "Lima" }, { value: "violet", label: "Violeta" }, { value: "sky", label: "Cielo" }]} />
          <TweakToggle label="Doodles flotantes" value={!!tweaks.doodles} onChange={(v) => setTweak("doodles", v)} />
        </TweakSection>
        <TweakSection label="Intro">
          <TweakToggle label="Intro al cargar" value={!!tweaks.playIntro} onChange={(v) => setTweak("playIntro", v)} />
          <TweakButton label="↺ Reproducir intro" onClick={replay} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
