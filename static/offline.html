<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MachReach — Sin conexión</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Nunito", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, #1b1209, #0b0b10 60%);
      color: #f8f3ea;
      display: flex; align-items: center; justify-content: center;
      padding: 28px calc(28px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(28px + env(safe-area-inset-left));
      text-align: center;
    }
    .card { max-width: 360px; }
    .logo {
      width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 22px;
      background: #0b0b10; border: 2px solid #ff7a3d; display: grid; place-items: center;
      font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 46px; color: #ff7a3d;
      box-shadow: 0 8px 30px rgba(255,122,61,.28);
    }
    h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: 26px; margin: 0 0 8px; letter-spacing: -.02em; }
    p { color: #b9b3aa; font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
    button {
      background: #ff7a3d; color: #0b0b10; border: 0; border-radius: 999px;
      font-weight: 800; font-size: 15px; padding: 13px 26px; cursor: pointer;
      box-shadow: 0 5px 0 rgba(80,30,5,.5);
    }
    button:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(80,30,5,.5); }
    .hint { margin-top: 18px; font-size: 12px; color: #6f6a62; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">M</div>
    <h1 id="offline-title">Sin conexión</h1>
    <p id="offline-copy">No pudimos cargar MachReach. Revisa tu conexión a internet y vuelve a intentarlo — tu progreso está a salvo.</p>
    <button id="offline-retry" onclick="location.reload()">Reintentar</button>
    <div class="hint" id="offline-hint">MachReach se reconecta solo cuando vuelvas a tener señal.</div>
  </div>
  <script>
    if ((navigator.language || '').toLowerCase().startsWith('en')) {
      document.documentElement.lang = 'en';
      document.title = 'MachReach — Offline';
      document.getElementById('offline-title').textContent = 'You are offline';
      document.getElementById('offline-copy').textContent = 'MachReach could not load. Check your internet connection and try again — your progress is safe.';
      document.getElementById('offline-retry').textContent = 'Retry';
      document.getElementById('offline-hint').textContent = 'MachReach reconnects automatically when your signal returns.';
    }
  </script>
</body>
</html>
