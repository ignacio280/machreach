<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MachReach">
  <style>
    .twinkle{ transform-box:fill-box; transform-origin:center; animation:mrtw 2.4s ease-in-out infinite; }
    @keyframes mrtw{ 0%,100%{transform:scale(.65);opacity:.55} 50%{transform:scale(1.15);opacity:1} }
    .sweep{ opacity:0; animation:mrshine 4.8s ease-in-out .8s infinite; }
    @keyframes mrshine{ 0%{transform:translateX(-55px);opacity:0} 8%{opacity:.9} 20%{opacity:0} 100%{transform:translateX(125px);opacity:0} }
    @media (prefers-reduced-motion: reduce){ .twinkle,.sweep{ animation:none !important } .sweep{ opacity:0 } }
  </style>
  <defs>
    <linearGradient id="mr_bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FF9351"/><stop offset="0.5" stop-color="#FF7A3D"/><stop offset="1" stop-color="#E0530F"/>
    </linearGradient>
    <radialGradient id="mr_gloss" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mr_vig" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#5a1c00" stop-opacity="0.30"/>
    </radialGradient>
    <linearGradient id="mr_shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mr_sqclip"><path d="M50 3 C19 3 3 19 3 50 C3 81 19 97 50 97 C81 97 97 81 97 50 C97 19 81 3 50 3 Z"/></clipPath>
    <clipPath id="mr_planetClip"><circle cx="0" cy="0" r="6.6"/></clipPath>
    <radialGradient id="mr_planetShade" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#241A45" stop-opacity="0"/><stop offset="1" stop-color="#211740" stop-opacity="0.62"/></radialGradient>
    <radialGradient id="mr_planetGrad" cx="0.36" cy="0.3" r="0.9"><stop offset="0" stop-color="#B49BE8"/><stop offset="0.5" stop-color="#6A53AE"/><stop offset="1" stop-color="#332258"/></radialGradient>
    <path id="mr_orbitPath" fill="none" d="M14 52 a36 16 0 1 0 72 0 a36 16 0 1 0 -72 0"/>
  </defs>

  <path d="M50 3 C19 3 3 19 3 50 C3 81 19 97 50 97 C81 97 97 81 97 50 C97 19 81 3 50 3 Z" fill="url(#mr_bg)"/>

  <!-- planet BEHIND the M -->
  <g transform="rotate(-24 50 52)">
    <g>
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#mr_orbitPath"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;1" values="0;1;0"/>
      <circle r="6.6" fill="url(#mr_planetGrad)"/>
      <g clip-path="url(#mr_planetClip)">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-13.2 0" dur="4.5s" repeatCount="indefinite"/>
          <ellipse cx="-3" cy="-2" rx="3.3" ry="1.6" fill="#3C2C70" opacity="0.6"/><ellipse cx="2.6" cy="2.1" rx="2.6" ry="1.4" fill="#8266C6" opacity="0.5"/>
          <ellipse cx="-0.8" cy="3.6" rx="1.7" ry="1" fill="#3C2C70" opacity="0.5"/><ellipse cx="4.4" cy="-3.4" rx="1.4" ry="0.9" fill="#8266C6" opacity="0.45"/>
          <ellipse cx="10.2" cy="-2" rx="3.3" ry="1.6" fill="#3C2C70" opacity="0.6"/><ellipse cx="15.8" cy="2.1" rx="2.6" ry="1.4" fill="#8266C6" opacity="0.5"/>
          <ellipse cx="12.4" cy="3.6" rx="1.7" ry="1" fill="#3C2C70" opacity="0.5"/><ellipse cx="17.6" cy="-3.4" rx="1.4" ry="0.9" fill="#8266C6" opacity="0.45"/>
        </g>
      </g>
      <circle r="6.6" fill="url(#mr_planetShade)"/>
      <ellipse cx="-2.3" cy="-2.7" rx="2.4" ry="1.6" fill="#fff" opacity="0.5"/>
    </g>
  </g>

  <!-- extruded M -->
  <path d="M28 74 V32 L50 58 L72 32 V74" fill="none" stroke="rgba(150,55,10,0.5)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" transform="translate(2.4,3)"/>
  <path d="M28 74 V32 L50 58 L72 32 V74" fill="none" stroke="#FFF6E4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- planet IN FRONT of the M -->
  <g transform="rotate(-24 50 52)">
    <g>
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#mr_orbitPath"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;1" values="1;0;1"/>
      <circle r="6.6" fill="url(#mr_planetGrad)"/>
      <g clip-path="url(#mr_planetClip)">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-13.2 0" dur="4.5s" repeatCount="indefinite"/>
          <ellipse cx="-3" cy="-2" rx="3.3" ry="1.6" fill="#3C2C70" opacity="0.6"/><ellipse cx="2.6" cy="2.1" rx="2.6" ry="1.4" fill="#8266C6" opacity="0.5"/>
          <ellipse cx="-0.8" cy="3.6" rx="1.7" ry="1" fill="#3C2C70" opacity="0.5"/><ellipse cx="4.4" cy="-3.4" rx="1.4" ry="0.9" fill="#8266C6" opacity="0.45"/>
          <ellipse cx="10.2" cy="-2" rx="3.3" ry="1.6" fill="#3C2C70" opacity="0.6"/><ellipse cx="15.8" cy="2.1" rx="2.6" ry="1.4" fill="#8266C6" opacity="0.5"/>
          <ellipse cx="12.4" cy="3.6" rx="1.7" ry="1" fill="#3C2C70" opacity="0.5"/><ellipse cx="17.6" cy="-3.4" rx="1.4" ry="0.9" fill="#8266C6" opacity="0.45"/>
        </g>
      </g>
      <circle r="6.6" fill="url(#mr_planetShade)"/>
      <ellipse cx="-2.3" cy="-2.7" rx="2.4" ry="1.6" fill="#fff" opacity="0.5"/>
    </g>
  </g>

  <!-- corner spark -->
  <path class="twinkle" d="M80 26 C81.5 27 82 27.5 84 28 C82 28.5 81.5 29 80 30 C79.5 29 79 28.5 78 28 C79 27.5 79.5 27 80 26 Z" fill="#FFF6E4" transform="scale(2.4) translate(-46.7,-15.2)"/>

  <!-- gloss + shimmer + vignette -->
  <ellipse cx="50" cy="20" rx="54" ry="30" fill="url(#mr_gloss)"/>
  <g clip-path="url(#mr_sqclip)"><rect class="sweep" x="-30" y="-20" width="34" height="140" fill="url(#mr_shine)" transform="skewX(-16)"/></g>
  <path d="M50 3 C19 3 3 19 3 50 C3 81 19 97 50 97 C81 97 97 81 97 50 C97 19 81 3 50 3 Z" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.4"/>
  <path d="M50 3 C19 3 3 19 3 50 C3 81 19 97 50 97 C81 97 97 81 97 50 C97 19 81 3 50 3 Z" fill="none" stroke="url(#mr_vig)"/>
  <path d="M50 3 C19 3 3 19 3 50 C3 81 19 97 50 97 C81 97 97 81 97 50 C97 19 81 3 50 3 Z" fill="url(#mr_vig)"/>
</svg>
