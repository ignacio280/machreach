<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bloqueado - Sesion de enfoque activa</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11131A;
      --panel: #1D202A;
      --panel-2: #171A23;
      --ink: #F7F0E4;
      --muted: #B9B0A5;
      --line: #34313A;
      --orange: #FF7A3D;
      --orange-soft: #FFE0C8;
      --cream: #F4F1EA;
      --black: #1A1A1F;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,122,61,.14), transparent 30%),
        radial-gradient(circle at 82% 16%, rgba(255,224,200,.08), transparent 28%),
        linear-gradient(180deg, #11131A 0%, #0D1017 100%);
      color: var(--ink);
      font-family: "Nunito", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow-x: hidden;
    }

    .brand {
      position: fixed;
      top: 24px;
      left: 28px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-weight: 900;
      letter-spacing: -.02em;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--black);
      color: var(--orange-soft);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.28), 0 10px 28px rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.08);
    }
    .brand span span { color: var(--orange); }

    .card {
      width: min(720px, 100%);
      background: rgba(29,32,42,.92);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: clamp(28px, 5vw, 54px);
      text-align: center;
      box-shadow: 0 28px 80px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.04);
      animation: enter .42s cubic-bezier(.22,.61,.36,1);
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(255,122,61,.22), rgba(255,224,200,.08));
      border: 1px solid rgba(255,122,61,.38);
      box-shadow: 0 0 0 8px rgba(255,122,61,.06);
      font-size: 38px;
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--orange);
      font-size: 12px;
      font-weight: 1000;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-family: "Bricolage Grotesque", "Nunito", "Inter", sans-serif;
      font-size: clamp(36px, 5vw, 66px);
      line-height: .94;
      letter-spacing: -.055em;
      font-weight: 800;
      color: var(--ink);
    }
    h1 em {
      color: var(--orange);
      font-style: italic;
    }

    p {
      max-width: 520px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
      font-weight: 700;
    }

    .src {
      display: inline-flex;
      max-width: 100%;
      margin: 0 auto 24px;
      padding: 9px 13px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .btns {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    a.primary {
      min-height: 48px;
      padding: 13px 22px;
      border-radius: 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 1000;
      text-decoration: none;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease;
    }
    a.primary {
      background: var(--orange);
      color: #24120A;
      border: 1px solid #F0642C;
      box-shadow: 0 5px 0 rgba(123,48,18,.48), 0 18px 34px rgba(255,122,61,.18);
    }
    a.primary:hover { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(123,48,18,.48), 0 24px 42px rgba(255,122,61,.22); }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #F4F1EA;
        --panel: #FFFDF8;
        --panel-2: #FBF8F0;
        --ink: #1A1A1F;
        --muted: #77756F;
        --line: #E2DCCC;
      }
      body {
        background:
          radial-gradient(circle at 18% 18%, rgba(255,122,61,.2), transparent 30%),
          radial-gradient(circle at 82% 16%, rgba(91,70,148,.09), transparent 28%),
          linear-gradient(180deg, #F4F1EA 0%, #FBF8F0 100%);
      }
      .card {
        background: rgba(255,253,248,.94);
        box-shadow: 0 22px 70px rgba(20,18,30,.12), inset 0 1px 0 rgba(255,255,255,.65);
      }
    }

    @media (max-width: 640px) {
      body { padding: 86px 18px 24px; place-items: start center; }
      .brand { top: 18px; left: 18px; }
      .card { border-radius: 22px; }
      .btns { flex-direction: column; }
      a.primary { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="brand" aria-label="MachReach">
    <div class="brand-mark">M</div>
    <span>Mach<span>Reach</span></span>
  </div>

  <main class="card">
    <div class="icon" aria-hidden="true">🛡️</div>
    <div class="kicker">Sesion de enfoque activa</div>
    <h1>Bloqueado por <em>Enfoque.</em></h1>
    <p>Estas estudiando con MachReach. Cierra la distraccion ahora y vuelve cuando termine tu temporizador.</p>
    <div class="src" id="src"></div>
    <div class="btns">
      <a class="primary" href="https://machreach.com/student/focus">← Volver a Enfoque</a>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get("src");
    const el = document.getElementById("src");
    if (src) { el.textContent = src; } else { el.style.display = "none"; }
  </script>
</body>
</html>
