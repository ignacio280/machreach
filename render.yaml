databases:
  - name: machreach-db
    plan: basic-256mb
    databaseName: machreach
    user: machreach

services:
  - type: web
    name: machreach
    runtime: python
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install --require-hashes -r requirements.lock
    preDeployCommand: python migrate.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --max-requests 5000 --max-requests-jitter 500
    healthCheckPath: /health
    domains:
      - machreach.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: machreach-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_ACTION_SECRET
        sync: false
      - key: OPERATIONS_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PLUS_MONTHLY_LIMIT
        value: "100"
      - key: AI_USER_DAILY_MAX
        value: "120"
      - key: AI_GLOBAL_DAILY_MAX
        value: "5000"
      - key: AI_USER_DAILY_TOKEN_MAX
        value: "1000000"
      - key: AI_GLOBAL_DAILY_TOKEN_MAX
        value: "25000000"
      - key: REFERRAL_REWARD_30D_MAX
        value: "20"
      - key: BASE_URL
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_TEST_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_TEST_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_SANDBOX_CLIENT_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_MODE
        value: "false"
      - key: LS_VARIANT_STUDENT_PLUS
        sync: false
      - key: LS_TEST_VARIANT_STUDENT_PLUS
        sync: false
      - key: LS_VARIANT_COIN_SMALL
        sync: false
      - key: LS_VARIANT_COIN_MEDIUM
        sync: false
      - key: LS_VARIANT_COIN_LARGE
        sync: false
      - key: LS_VARIANT_COIN_MEGA
        sync: false
      - key: LS_VARIANT_COIN_ULTRA
        sync: false
      - key: LS_TEST_VARIANT_COIN_SMALL
        sync: false
      - key: LS_TEST_VARIANT_COIN_MEDIUM
        sync: false
      - key: LS_TEST_VARIANT_COIN_LARGE
        sync: false
      - key: LS_TEST_VARIANT_COIN_MEGA
        sync: false
      - key: LS_TEST_VARIANT_COIN_ULTRA
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      - key: LEADERBOARD_WINNERS_RECIPIENT
        sync: false

  - type: worker
    name: machreach-worker
    runtime: python
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install --require-hashes -r requirements.lock
    preDeployCommand: python migrate.py
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: machreach-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_ACTION_SECRET
        sync: false
      - key: OPERATIONS_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PLUS_MONTHLY_LIMIT
        value: "100"
      - key: AI_USER_DAILY_MAX
        value: "120"
      - key: AI_GLOBAL_DAILY_MAX
        value: "5000"
      - key: AI_USER_DAILY_TOKEN_MAX
        value: "1000000"
      - key: AI_GLOBAL_DAILY_TOKEN_MAX
        value: "25000000"
      - key: REFERRAL_REWARD_30D_MAX
        value: "20"
      - key: BASE_URL
        sync: false
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LEADERBOARD_WINNERS_RECIPIENT
        sync: false
