# No `databases:` block on purpose. Production Postgres is hosted on Neon
# (docs/NEON_MIGRATION.md); DATABASE_URL below is the Neon *direct* connection
# string, set by hand in the dashboard on both services. Do not add a Render
# database back here: a Blueprint sync would provision and bill it.

services:
  - type: web
    name: machreach
    runtime: python
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install --require-hashes -r requirements.lock
    # The only place migrations run in production: cron jobs have no
    # pre-deploy step, so the worker no longer races this one.
    preDeployCommand: python migrate.py
    # One worker on purpose: the in-memory rate limiter counts per process, so
    # a second worker would halve every limit's accuracy until Redis exists.
    # Threads are the cheap axis — requests here are IO-bound (Postgres, and
    # AI calls bounded to 40s via .with_options), so 8 threads on 0.5 CPU
    # trades idle wait, not compute.
    #
    # --preload is what makes one worker survivable. Without it, every
    # --max-requests recycle leaves the service with no worker at all while a
    # replacement imports the application from scratch: 2.5s on a developer
    # machine, several times that on half a shared CPU. Render kills an
    # instance that cannot answer /health within five seconds, so a routine
    # recycle read as a dead instance — that is the "HTTP health check failed
    # (timed out after 5 seconds)" mail, and the page that would not load for
    # whoever was mid-request. Preloaded, the app is imported once in the
    # arbiter and a replacement worker is a fork: microseconds, no gap.
    #
    # Safe to fork here because nothing at import time owns a connection or a
    # thread: the Postgres pool is lazy, migrations run in preDeployCommand
    # rather than at import (test_gunicorn_preload_is_safe pins both), and the
    # Sentry background worker re-spawns itself in the child on first use.
    # It also makes the recycle do its job properly — the fresh worker forks
    # from the arbiter's clean image, so whatever the old one leaked is gone.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --preload --timeout 120 --max-requests 5000 --max-requests-jitter 500
    healthCheckPath: /health
    domains:
      - machreach.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Neon direct endpoint with ?sslmode=require. Not the -pooler endpoint:
      # the app keeps its own pool, and migrate.py's advisory lock needs a
      # real session (PgBouncer transaction pooling breaks both).
      - key: DATABASE_URL
        sync: false
      # The worker is a cron job that beats once per run (every minute) and
      # every 30s while busy. Runs can start late, so alert at three minutes,
      # not the two that fit the always-on worker.
      - key: WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"
      - key: SECRET_KEY
        generateValue: true
      # Sized for 8 gunicorn threads plus the background daemon threads that
      # also hit the DB; still far under the Postgres plan's connection limit.
      - key: DB_POOL_MAX
        value: "12"
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_ACTION_SECRET
        sync: false
      - key: OPERATIONS_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PLUS_MONTHLY_LIMIT
        value: "100"
      - key: AI_USER_DAILY_MAX
        value: "120"
      - key: AI_GLOBAL_DAILY_MAX
        value: "5000"
      - key: AI_USER_DAILY_TOKEN_MAX
        value: "1000000"
      - key: AI_GLOBAL_DAILY_TOKEN_MAX
        value: "25000000"
      - key: AI_ESTIMATED_INPUT_USD_PER_MILLION
        value: "0.15"
      - key: AI_ESTIMATED_OUTPUT_USD_PER_MILLION
        value: "0.60"
      - key: REFERRAL_REWARD_30D_MAX
        value: "20"
      - key: ACADEMIC_UNIVERSITY_CHANGE_COOLDOWN_DAYS
        value: "30"
      - key: BASE_URL
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_TEST_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_TEST_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_SANDBOX_CLIENT_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_MODE
        value: "false"
      - key: LS_VARIANT_STUDENT_PLUS
        sync: false
      - key: LS_PRODUCT_STUDENT_PLUS
        sync: false
      - key: LS_TEST_VARIANT_STUDENT_PLUS
        sync: false
      - key: LS_TEST_PRODUCT_STUDENT_PLUS
        sync: false
      - key: LS_PRODUCT_COIN_SMALL
        sync: false
      - key: LS_PRODUCT_COIN_MEDIUM
        sync: false
      - key: LS_PRODUCT_COIN_LARGE
        sync: false
      - key: LS_PRODUCT_COIN_MEGA
        sync: false
      - key: LS_PRODUCT_COIN_ULTRA
        sync: false
      - key: LS_VARIANT_COIN_SMALL
        sync: false
      - key: LS_VARIANT_COIN_MEDIUM
        sync: false
      - key: LS_VARIANT_COIN_LARGE
        sync: false
      - key: LS_VARIANT_COIN_MEGA
        sync: false
      - key: LS_VARIANT_COIN_ULTRA
        sync: false
      - key: LS_TEST_VARIANT_COIN_SMALL
        sync: false
      - key: LS_TEST_PRODUCT_COIN_SMALL
        sync: false
      - key: LS_TEST_PRODUCT_COIN_MEDIUM
        sync: false
      - key: LS_TEST_PRODUCT_COIN_LARGE
        sync: false
      - key: LS_TEST_PRODUCT_COIN_MEGA
        sync: false
      - key: LS_TEST_PRODUCT_COIN_ULTRA
        sync: false
      - key: LS_TEST_VARIANT_COIN_MEDIUM
        sync: false
      - key: LS_TEST_VARIANT_COIN_LARGE
        sync: false
      - key: LS_TEST_VARIANT_COIN_MEGA
        sync: false
      - key: LS_TEST_VARIANT_COIN_ULTRA
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      - key: LEADERBOARD_WINNERS_RECIPIENT
        sync: false

  # The background worker as a cron job instead of an always-on instance.
  # Cron jobs bill per second of runtime, so an idle minute costs the few
  # seconds a run takes rather than the full instance. Each run executes every
  # interval job once, fires any time-of-day job whose scheduled time has
  # passed (state kept in the database, see worker.py), then drains the queue
  # of student jobs for up to WORKER_RUN_MAX_SECONDS before exiting.
  #
  # What this changes for a student: a queued quiz, flashcard deck, or
  # verification email now waits for the next run (up to a minute, plus
  # start-up) instead of the five-second poll of the old worker. Everything
  # else is the same code on the same schedule.
  #
  # Render evaluates the schedule in UTC; the jobs themselves keep
  # America/Santiago times in the database, so DST needs no edits here.
  # There is no preDeployCommand on cron jobs: migrations run in the web
  # service's pre-deploy step, and a run that starts on a stale schema fails
  # check_schema_readiness() and simply retries next minute.
  - type: cron
    name: machreach-worker
    runtime: python
    plan: starter
    schedule: "* * * * *"
    autoDeployTrigger: checksPass
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: python worker.py --once
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      # Bound on the queue drain, not on a job in flight. Keep it under the
      # schedule interval so runs do not pile up behind each other.
      - key: WORKER_RUN_MAX_SECONDS
        value: "50"
      # A cron run is one process with a few daemon threads; this stays far
      # under any Neon compute's connection limit.
      - key: DB_POOL_MAX
        value: "4"
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_ACTION_SECRET
        sync: false
      - key: OPERATIONS_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PLUS_MONTHLY_LIMIT
        value: "100"
      - key: AI_USER_DAILY_MAX
        value: "120"
      - key: AI_GLOBAL_DAILY_MAX
        value: "5000"
      - key: AI_USER_DAILY_TOKEN_MAX
        value: "1000000"
      - key: AI_GLOBAL_DAILY_TOKEN_MAX
        value: "25000000"
      - key: AI_ESTIMATED_INPUT_USD_PER_MILLION
        value: "0.15"
      - key: AI_ESTIMATED_OUTPUT_USD_PER_MILLION
        value: "0.60"
      - key: REFERRAL_REWARD_30D_MAX
        value: "20"
      - key: ACADEMIC_UNIVERSITY_CHANGE_COOLDOWN_DAYS
        value: "30"
      - key: BASE_URL
        sync: false
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LEADERBOARD_WINNERS_RECIPIENT
        sync: false
