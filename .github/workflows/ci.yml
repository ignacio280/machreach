name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Deliberately its own job, and deliberately first. These steps used to sit
  # at the tail of test-and-build, behind the linter and seven coverage gates,
  # so a formatting complaint was enough to stop them running at all. That is
  # how cryptography 49.0.0 (PYSEC-2026-3552) and brace-expansion 5.0.8
  # (GHSA-rgw5-rvv9-x895) went three days unreported while CI sat red for
  # unrelated reasons. A vulnerability scan must not depend on the code being
  # tidy, so nothing here needs the application installed or the tests green.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            landing_build/package-lock.json
            ios-app/package-lock.json
      - name: Install the auditor only
        # pip-audit reads the lock file; it does not need the packages
        # themselves, so a broken dependency cannot hide a known CVE.
        run: python -m pip install pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.lock
      - name: Audit landing build dependencies
        working-directory: landing_build
        run: |
          npm ci
          npm audit --audit-level=moderate
      - name: Audit iOS dependencies
        working-directory: ios-app
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing_build/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.0.2 pytest-cov==7.1.0 ruff==0.15.21 mypy==2.2.0
      - name: Compile, lint, and type-check application
        run: |
          python -m compileall -q app.py migrate.py machreach_core student worker.py
          ruff check . --exclude work
          python -m mypy app.py worker.py machreach_core student --ignore-missing-imports --no-error-summary
      - name: Test with coverage floor
        run: >-
          python -m pytest
          --cov=app --cov=machreach_core --cov=student --cov=worker
          --cov-report=term-missing:skip-covered
          --cov-fail-under=80
          -q
      - name: Enforce AI accounting coverage
        run: >-
          python -m pytest tests/test_ai_usage.py
          --cov=student.ai_usage
          --cov-report=term-missing
          --cov-fail-under=90
          -q
      - name: Enforce critical money and security coverage
        run: |
          python -m pytest tests/test_leaderboard_prizes_comprehensive.py \
            --cov=student.leaderboard_prizes --cov-report=term-missing \
            --cov-fail-under=90 -q
          python -m pytest tests/test_admin_security.py \
            tests/test_admin_and_premium_routes.py tests/test_auth_security.py \
            --cov=machreach_core.admin_security --cov-report=term-missing \
            --cov-fail-under=90 -q
          python -m pytest tests/test_verification_delivery.py \
            --cov=machreach_core.verification_delivery --cov-report=term-missing \
            --cov-fail-under=90 -q
          python -m pytest tests/test_friend_privacy.py \
            --cov=student.friend_routes --cov-report=term-missing \
            --cov-fail-under=90 -q
          python -m pytest tests/test_canvas_and_i18n.py tests/test_upload_safety.py \
            tests/test_extension.py tests/test_canvas_reconciliation.py \
            --cov=student.canvas --cov-report=term-missing \
            --cov-fail-under=90 -q
          python -m pytest tests/test_worker_comprehensive.py \
            --cov=worker --cov-report=term-missing \
            --cov-fail-under=90 -q
          python -m pytest tests/test_analyzer.py \
            --cov=student.analyzer --cov-report=term-missing \
            --cov-fail-under=90 -q
      - name: Verify landing build is reproducible
        # The bundle is committed, so this proves the artifact in the repo is
        # what the current source actually produces. Vulnerability scanning for
        # these same packages lives in dependency-audit.
        working-directory: landing_build
        run: |
          npm ci
          node build.mjs
          git diff --exit-code -- ../static/machreach_landing
      - name: Verify student app bundles match their sources
        # static/machreach_app holds committed build output that the live
        # student pages load directly, and nothing rebuilt it here until now.
        # A .jsx edited without running build-app.mjs simply never reached a
        # student: the source looked right, review looked right, and the page
        # kept serving the previous bundle. That is how the ranking board lost
        # its links to /student/profile/<id> without a single failing check.
        #
        # --stat because these are minified bundles: the file names say what is
        # stale, and the full diff would be thousands of unreadable columns.
        working-directory: landing_build
        run: |
          node build-app.mjs
          git diff --exit-code --stat -- ../static/machreach_app || {
            echo "::error::static/machreach_app is stale. Run 'node build-app.mjs' in landing_build/ and commit the rebuilt bundles."
            exit 1
          }
      - name: Validate Focus Guard JavaScript and manifest
        run: |
          node --check extensions/focus-guard/background.js
          node --check extensions/focus-guard/canvas.js
          node --check extensions/focus-guard/content.js
          node --check extensions/focus-guard/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extensions/focus-guard/manifest.json','utf8'))"

  postgres-critical-paths:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: machreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d machreach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MACHREACH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machreach_test
      SECRET_KEY: postgres-test-secret
      ENCRYPTION_KEY: postgres-test-encryption-key
      LEMON_SQUEEZY_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.0.2
      - name: Run security, money, and concurrency paths on Postgres
        run: >-
          python -m pytest -q
          tests/test_student_tenant_security.py
          tests/test_wallet_atomicity.py
          tests/test_focus.py
          tests/test_billing_webhook.py
          tests/test_ai_usage.py
          tests/test_delete_account_billing.py
          tests/test_canvas_reconciliation.py
          tests/test_removed_legacy_surface.py
          tests/test_leaderboard_prizes_comprehensive.py
          tests/test_planner_stats_http_journey.py
          tests/test_db_pool_liveness.py
          tests/test_migrate_to_neon_script.py

  browser-journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install locked application dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Run browser journeys
        working-directory: e2e
        run: npm test
