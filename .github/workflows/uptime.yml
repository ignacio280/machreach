name: Production uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the uptime monitor
        uses: actions/checkout@v6

      - name: Verify public and operational health
        env:
          OPERATIONS_SECRET: ${{ secrets.OPERATIONS_SECRET }}
        run: python scripts/check_uptime.py
