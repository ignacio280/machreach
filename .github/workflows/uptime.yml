name: Production uptime

# Manual only. The scheduled run is deliberately gone: every five minutes
# against a service that is down meant a failure mail every five minutes, and
# the owner asked for it to stop rather than be made quieter. Restore the two
# commented lines to turn the monitor back on.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Reading this workflow's own history is how the check knows whether the
  # previous run already reported the outage, so a continuing one does not
  # send a mail every five minutes.
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the uptime monitor
        uses: actions/checkout@v6

      - name: Verify public and operational health
        env:
          OPERATIONS_SECRET: ${{ secrets.OPERATIONS_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_uptime.py
